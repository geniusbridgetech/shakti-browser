  <div id="browser">
    <!-- ================= TAB STRIP (also the window title bar) ================= -->
    <header class="tabstrip" id="tabstrip">
      <div class="incognito-badge" id="incognito-badge" hidden title="Incognito"><svg><use href="#i-incognito"/></svg></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="newtab-btn" id="btn-newtab" title="New tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
      <div class="tabstrip-drag"></div>
      <div class="window-controls" id="window-controls">
        <button data-win="minimize" title="Minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
        <button data-win="maximize" id="btn-maximize" title="Maximize" aria-label="Maximize"><svg><use href="#i-max"/></svg></button>
        <button data-win="close" class="win-close" title="Close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <!-- ================= TOOLBAR ================= -->
    <nav class="toolbar">
      <button class="icon-btn" id="btn-back" title="Back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <button class="icon-btn" id="btn-forward" title="Forward" aria-label="Forward"><svg><use href="#i-forward"/></svg></button>
      <button class="icon-btn" id="btn-reload" title="Reload" aria-label="Reload"><svg><use href="#i-reload"/></svg></button>
      <button class="icon-btn" id="btn-home" title="Home" aria-label="Home"><svg><use href="#i-home"/></svg></button>

      <div class="omnibox" id="omnibox">
        <button class="omni-chip" id="site-info" title="View site information"><svg><use href="#i-info"/></svg></button>
        <input id="omnibox-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search Google or type a URL" aria-label="Address and search bar">
        <span class="zoom-chip" id="zoom-chip" hidden></span>
        <button class="icon-btn small" id="btn-star" title="Bookmark this tab" aria-label="Bookmark this tab"><svg><use href="#i-star"/></svg></button>
        <div class="omni-suggest" id="omni-suggest" role="listbox"></div>
      </div>

      <button class="icon-btn" id="btn-downloads" title="Downloads" aria-label="Downloads" hidden><svg><use href="#i-download"/></svg><span class="dl-ring" id="dl-ring"></span></button>
      <button class="agent-btn" id="btn-agent" title="Shakti AI" aria-label="Open Shakti AI">
        <svg><use href="#i-sparkle"/></svg><span>Shakti AI</span>
      </button>
      <button class="icon-btn" id="btn-menu" title="Customize and control Shakti Browser" aria-label="Menu"><svg><use href="#i-more"/></svg></button>
    </nav>

    <!-- ================= BOOKMARKS BAR ================= -->
    <div class="bookmarks-bar" id="bookmarks-bar"></div>

    <!-- ================= MAIN ================= -->
    <div class="main">
      <div class="views" id="views">
        <div class="findbar" id="findbar" hidden>
          <input id="find-input" type="text" placeholder="Find in page" spellcheck="false">
          <span id="find-count"></span>
          <button class="icon-btn small" id="find-prev" title="Previous"><svg><use href="#i-up"/></svg></button>
          <button class="icon-btn small" id="find-next" title="Next"><svg><use href="#i-down"/></svg></button>
          <button class="icon-btn small" id="find-close" title="Close"><svg><use href="#i-close"/></svg></button>
        </div>
      </div>

      <!-- ================= AI AGENT SIDE PANEL ================= -->
      <aside class="agent-panel" id="agent-panel" hidden aria-label="Shakti AI">
        <div class="agent-head">
          <div class="agent-title"><svg><use href="#i-sparkle"/></svg><span>Shakti AI</span><span class="agent-mode" id="agent-mode">…</span></div>
          <button class="icon-btn small" id="agent-new" title="New chat"><svg><use href="#i-newchat"/></svg></button>
          <button class="icon-btn small" id="agent-close" title="Close"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="agent-log" id="agent-log">
          <div class="agent-welcome" id="agent-welcome">
            <div class="agent-orb"><svg><use href="#i-sparkle"/></svg></div>
            <h2>How can I help you browse?</h2>
            <p>I can read this page, answer questions, search the web, and do multi-step tasks like opening links and filling search boxes.</p>
            <div class="agent-suggestions">
              <button data-prompt="Summarize this page">Summarize this page</button>
              <button data-prompt="What are the key points on this page?">Key points on this page</button>
              <button data-prompt="Search the web for the latest ISRO missions and summarize the top result">Research: latest ISRO missions</button>
              <button data-prompt="Open wikipedia.org">Open wikipedia.org</button>
            </div>
          </div>
        </div>
        <form class="agent-input" id="agent-form">
          <textarea id="agent-text" rows="1" placeholder="Ask Shakti AI or give it a task…"></textarea>
          <button type="submit" class="agent-send" id="agent-send" title="Send" aria-label="Send"><svg><use href="#i-send"/></svg></button>
        </form>
        <div class="agent-foot" id="agent-foot"></div>
      </aside>
    </div>

    <!-- ================= MENU ================= -->
    <div class="menu" id="menu" hidden role="menu">
      <button data-cmd="new-tab"><span>New tab</span><kbd data-k="T"></kbd></button>
      <button data-cmd="new-window"><span>New window</span><kbd data-k="N"></kbd></button>
      <button data-cmd="new-incognito"><span>New Incognito window</span><kbd data-k="Shift+N"></kbd></button>
      <hr>
      <button data-cmd="history"><span>History</span><kbd data-k="H"></kbd></button>
      <button data-cmd="downloads"><span>Downloads</span><kbd data-k="J"></kbd></button>
      <button data-cmd="bookmarks"><span>Bookmarks</span><kbd data-k="Shift+O"></kbd></button>
      <hr>
      <div class="menu-zoom"><span>Zoom</span><button data-cmd="zoom-out" data-keep>−</button><span id="menu-zoom-val">100%</span><button data-cmd="zoom-in" data-keep>+</button><button data-cmd="fullscreen" title="Full screen">⛶</button></div>
      <hr>
      <button data-cmd="print"><span>Print…</span><kbd data-k="P"></kbd></button>
      <button data-cmd="find"><span>Find…</span><kbd data-k="F"></kbd></button>
      <button data-cmd="save-as"><span>Save page as…</span><kbd></kbd></button>
      <button data-cmd="toggle-agent"><span>Shakti AI agent</span><kbd data-k="E"></kbd></button>
      <button data-cmd="devtools"><span>Developer tools</span><kbd data-k="Shift+I"></kbd></button>
      <hr>
      <button data-cmd="settings"><span>Settings</span><kbd></kbd></button>
      <button data-cmd="about"><span>About Shakti Browser</span><kbd></kbd></button>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="browser.js"></script>
  <script src="agent.js"></script>
</body>
</html>
